<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop — Lumière</title>
  <script>
    (function () {
      var t = null;
      try { t = JSON.parse(localStorage.getItem('lum_theme')); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="shop">

<main id="main">
  <div class="container">

    <nav class="crumbs" aria-label="Breadcrumb">
      <a href="index.html">Home</a><i>/</i><span id="crumbCur">Shop</span>
    </nav>

    <section class="banner">
      <div class="banner-copy">
        <h1 id="bannerTitle">Shop</h1>
        <p id="bannerTag"></p>
      </div>
      <span class="media"><img id="bannerImg" src="images/banner-all.jpg" alt=""></span>
    </section>

    <div class="shop">
      <aside class="filters" aria-label="Filters">
        <div class="filters-head">
          <h2>Filters</h2>
          <span>
            <button class="link-btn" id="clearBtn" type="button">Clear all</button>
          </span>
        </div>

        <div class="fgroup"><h3>Category</h3><ul id="fSubs"></ul></div>
        <div class="fgroup"><h3>Brand</h3><ul id="fBrands"></ul></div>
        <div class="fgroup">
          <h3>Price</h3>
          <input class="range" id="fPrice" type="range" min="0" max="100" step="1" value="100" aria-label="Maximum price">
          <div class="range-out"><span>$0</span><span id="priceMax">$100</span></div>
        </div>
        <div class="fgroup">
          <h3>Rating</h3>
          <ul>
            <li><label class="check"><input type="radio" name="rating" value="4.5"><span>4.5 &amp; up</span></label></li>
            <li><label class="check"><input type="radio" name="rating" value="4"><span>4 &amp; up</span></label></li>
            <li><label class="check"><input type="radio" name="rating" value="3"><span>3 &amp; up</span></label></li>
            <li><label class="check"><input type="radio" name="rating" value="0" checked><span>All ratings</span></label></li>
          </ul>
        </div>
        <button class="btn btn-block btn-sm filters-close" type="button" style="margin-top:6px">Show results</button>
      </aside>

      <section aria-label="Products">
        <div class="toolbar">
          <button class="btn btn-ghost btn-sm filter-toggle" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 5h18M6 12h12M10 19h4"/></svg>Filters
          </button>
          <p id="count" role="status"></p>
          <label>Sort by
            <select class="select" id="sort">
              <option value="popular">Popularity</option>
              <option value="rating">Top rated</option>
              <option value="low">Price: low to high</option>
              <option value="high">Price: high to low</option>
              <option value="newest">Newest</option>
            </select>
          </label>
        </div>
        <div class="grid" id="grid"></div>
        <nav class="pager" id="pager" aria-label="Pagination"></nav>
      </section>
    </div>

    <section class="cta-strip">
      <div>
        <h2>Take care of yourself</h2>
        <p>Healthy, confident, and comfortable in your own skin.</p>
      </div>
      <span class="media"><img src="images/strip.jpg" data-src="images/strip.jpg" alt="" loading="lazy"></span>
    </section>

  </div>
</main>

<script src="js/jquery.js"></script>
<script src="js/products.js"></script>
<script src="js/main.js"></script>
</body>
</html>
